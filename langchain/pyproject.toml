[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-tablejourney"
version = "0.1.0"
description = "TableJourney food travel tools for LangChain: verified places to eat, food festivals with dates, food tours, cooking classes and stays in 224 cities."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "TableJourney", email = "support@tablejourney.com" }]
dependencies = ["langchain-core>=0.3", "pydantic>=2"]
keywords = ["langchain", "tools", "agents", "travel", "food", "restaurants", "festivals", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://tablejourney.com/agents/#langchain"
Documentation = "https://tablejourney.com/agents/#langchain"
Source = "https://github.com/lewismvaughan/tablejourney-mcp"

[tool.hatch.build.targets.wheel]
packages = ["langchain_tablejourney"]
