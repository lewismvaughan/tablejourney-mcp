identity:
  author: lewismvaughan
  name: tablejourney
  label:
    en_US: TableJourney
    zh_Hans: TableJourney 美食旅行
  description:
    en_US: Verified food places, festivals, signature dishes, itineraries, tours, tickets, stays and car hire in 224 cities, with the source of every listing on its page. Public read-only API at tablejourney.com; no key required.
    zh_Hans: 覆盖 224 个城市的已核实美食场所、美食节、特色菜、行程、导览、门票、住宿和租车信息，每条数据的来源都写在其页面上。来自 tablejourney.com 的公开只读接口，无需 Key。
  icon: icon.png
  tags:
    - travel
    - utilities
credentials_for_provider:
  api_key:
    type: secret-input
    required: false
    label:
      en_US: Partner API key (optional)
      zh_Hans: 合作伙伴 API Key（可选）
    placeholder:
      en_US: Leave blank to use the tools without a key
      zh_Hans: 留空即可在无 Key 的情况下使用
    help:
      en_US: Optional. A TableJourney partner API key. When it is set, the booking links the tools return carry your partner code. It does not change the data the tools return, and every tool works without it.
      zh_Hans: 可选。TableJourney 合作伙伴 API Key。设置后，工具返回的预订链接会带上你的合作伙伴代码。它不会改变工具返回的数据，不填写时所有工具同样可用。
    url: https://tablejourney.com/agents/earn/
extra:
  python:
    source: provider/tablejourney.py
tools:
  - tools/search_places.yaml
  - tools/plan_day.yaml
  - tools/festivals.yaml
  - tools/experiences.yaml
  - tools/cities.yaml
  - tools/things_to_do.yaml
  - tools/dishes.yaml
  - tools/itineraries.yaml
  - tools/place.yaml
  - tools/stays.yaml
  - tools/tickets.yaml
  - tools/car_hire.yaml
