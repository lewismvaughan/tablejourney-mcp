identity:
  author: lewismvaughan
  name: tablejourney
  label:
    en_US: TableJourney
    zh_Hans: TableJourney 美食旅行
  description:
    en_US: Verified food places, festivals, tours and stays in 200+ cities, with provenance on every entity. Public read-only API at tablejourney.com, no authentication required.
    zh_Hans: 覆盖 200 多个城市、每条数据都有可核实来源的美食场所、美食节、行程与住宿信息。来自 tablejourney.com 的公开只读接口，无需身份验证。
  icon: icon.png
  tags:
    - travel
    - utilities
credentials_for_provider:
  api_key:
    type: secret-input
    required: false
    label:
      en_US: API key (optional)
      zh_Hans: API Key（可选）
    placeholder:
      en_US: Leave blank unless you have a TableJourney agent API key
      zh_Hans: 除非你有 TableJourney 代理接口的 API Key，否则留空
    help:
      en_US: TableJourney's API is public and works with no key. An optional key only tags your requests for attribution in TableJourney's own usage reporting; it unlocks no extra data and is never required.
      zh_Hans: TableJourney 接口是公开的，无需 Key 即可使用。可选的 Key 仅用于在 TableJourney 自己的用量统计中标记请求来源，不会解锁额外数据，也不是必需项。
    url: https://tablejourney.com/agents/
extra:
  python:
    source: provider/tablejourney.py
tools:
  - tools/search_places.yaml
  - tools/plan_day.yaml
  - tools/festivals.yaml
  - tools/experiences.yaml
  - tools/cities.yaml
